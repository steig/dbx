name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN: CI only reads the repo. Overridable per-job if a
# future job needs more (e.g. packages: write).
permissions:
  contents: read

# Every job carries a timeout-minutes. GitHub's default is 360, so a test that
# hangs rather than fails holds a runner for six hours; the #176 port-race used
# to burn 31 minutes a run this way. Values are ~4-5x the observed runtime, so
# they only fire on a genuine hang, never on a slow-but-healthy run.
jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'
          severity: error
          additional_files: 'dbx'
          check_together: 'yes'

  test-install:
    name: Test Install
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zstd

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq zstd

      - name: Test install script (local)
        run: |
          # Test local install (not curl)
          mkdir -p ~/.local/bin ~/.local/lib/dbx
          cp dbx ~/.local/bin/
          cp lib/*.sh ~/.local/lib/dbx/
          sed -i.bak 's|LIB_DIR="$SCRIPT_DIR/lib"|LIB_DIR="$HOME/.local/lib/dbx"|' ~/.local/bin/dbx || \
            sed -i '' 's|LIB_DIR="$SCRIPT_DIR/lib"|LIB_DIR="$HOME/.local/lib/dbx"|' ~/.local/bin/dbx
          chmod +x ~/.local/bin/dbx

      - name: Verify dbx runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dbx help

      - name: Test config init
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dbx config init
          test -f ~/.config/dbx/config.json

  test-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check bash syntax
        run: |
          bash -n dbx
          for f in lib/*.sh; do
            bash -n "$f"
          done

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Fails the PR if install.sh's MAN_PAGES / lib lists drift from the files
      # on disk, or if any man-page .TH version != VERSION in dbx. Catches the
      # desync class that shipped dbx-build-image.1 broken (#122, #147).
      - name: Check release-synchronized files are in sync
        run: bash scripts/check-release-consistency.sh

  ruff:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned so a ruff release can't turn main red without a deliberate bump.
      # Config (scope + rules) lives in pyproject.toml; format-check is omitted
      # on purpose — see the comment there.
      - name: Install ruff
        run: pip install ruff==0.15.14

      - name: Run ruff check
        run: ruff check

  unit-tests:
    name: Unit tests (bats)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # wizard_server.bats starts lib/wizard-server.py for each of its 179
      # tests, so the suite needs a working python3. Pinning it here rather
      # than trusting the runner image: macos-latest stopped shipping a usable
      # python3, which turned the whole file red and stretched the job to ~31
      # minutes of identical timeouts. Same version the ruff job pins.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `parallel` backs `bats --jobs`.
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq zstd parallel

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq zstd parallel

      # Tests are independent — each gets its own BATS_TEST_TMPDIR, and the
      # wizard server binds port 0 — so they parallelize safely. Locally this
      # takes the suite from 101s to 34s.
      - name: Run unit tests
        run: bats --jobs 8 tests/unit/

  integration-tests:
    name: Integration tests (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq zstd age

      - name: Run integration tests
        run: bats tests/integration/

  # macOS counterpart to the job above. dbx runs pg_dump/psql/mysqldump *inside*
  # the managed containers, so every round-trip test needs a Docker daemon —
  # and GitHub's macOS runners cannot provide one: the arm64 images have no
  # nested virtualization, so Colima/Lima cannot boot their VM, and macos-13
  # (the last Intel image where that worked) was retired in December 2025.
  #
  # So this job runs the same suite and lets the Docker-dependent files skip
  # themselves via require_docker. What executes is the host-side bash — file
  # naming, retention, metadata, arg handling — which is exactly where the
  # BSD-vs-GNU divergence this job exists to catch actually lives. It found
  # two on the way in: `wc -l` padding in the tests, and a `stat` dialect
  # branch in `dbx clean --older-than` (#142).
  integration-tests-macos:
    name: Integration tests (macOS, Docker-free subset)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install bats-core jq zstd

      - name: Run integration tests
        run: |
          set -o pipefail
          bats --formatter tap tests/integration/ | tee "$RUNNER_TEMP/integration.tap"

      # bats reports a run where every test skipped as a pass, so on its own
      # the step above would go green while testing nothing — and would stay
      # green if the Docker-free tests were deleted or gated behind Docker.
      # This asserts a floor on tests that actually executed.
      - name: Assert the run actually exercised something
        if: always()
        run: bash scripts/check-integration-coverage.sh "$RUNNER_TEMP/integration.tap" 10

  docker-image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Build-only (no push) so a broken Dockerfile fails the PR. The release
      # publish (multi-arch → GHCR) lives in release-image.yml, on tags.
      - name: Build image
        run: docker build -f docker/Dockerfile -t dbx:ci .

      - name: Smoke test (version prints, libs resolve)
        run: |
          version=$(docker run --rm dbx:ci version)
          echo "$version"
          echo "$version" | grep -qE '^dbx [0-9]+\.[0-9]+\.[0-9]+$'
          docker run --rm dbx:ci --help >/dev/null
