name: Release image

# Publish the official `dbx serve` image to GHCR on each release tag (v*).
# The tag is cut by the manual release process (see the release checklist), so
# this just builds the multi-arch image and pushes it as :<version> + :latest.
on:
  push:
    tags: ['v*']

# Read the repo; write packages (push to ghcr.io/<owner>/dbx).
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # Multi-arch (amd64 + arm64) under QEMU, so this is the slowest job we run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # QEMU + Buildx give us the linux/arm64 build alongside amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dbx:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dbx:latest
